name: Sync upstream code-modernization

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-upstream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-filter-repo
        run: |
          python3 -m pip install --user git-filter-repo
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch upstream
        run: |
          git remote add upstream \
            https://github.com/anthropics/claude-plugins-official.git

          git fetch upstream main

      - name: Prepare filtered upstream
        run: |
          TEMP_DIR="$(mktemp -d)"
          echo "TEMP_DIR=$TEMP_DIR" >> "$GITHUB_ENV"

          git clone --quiet \
            https://github.com/anthropics/claude-plugins-official.git \
            "$TEMP_DIR/upstream"

          cd "$TEMP_DIR/upstream"

          git filter-repo \
            --path plugins/code-modernization/ \
            --path-rename plugins/code-modernization/:

      - name: Import filtered upstream history
        run: |
          cd "$GITHUB_WORKSPACE"

          git fetch "$TEMP_DIR/upstream" main

      - name: Compare histories
        id: compare
        run: |
          cd "$GITHUB_WORKSPACE"

          UPSTREAM_COMMIT="$(git rev-parse FETCH_HEAD)"
          MAIN_COMMIT="$(git rev-parse main)"
          MERGE_BASE="$(git merge-base main FETCH_HEAD)"

          echo "Filtered upstream commit:"
          echo "$UPSTREAM_COMMIT"

          echo
          echo "Repository main commit:"
          echo "$MAIN_COMMIT"

          echo
          echo "Common ancestor:"
          echo "$MERGE_BASE"

          echo
          echo "Filtered upstream root:"
          git -C "$TEMP_DIR/upstream" ls-tree --name-only HEAD

          echo
          echo "Last filtered upstream commits:"
          git -C "$TEMP_DIR/upstream" log --oneline -5

          echo
          echo "Changes since common ancestor:"
          git diff --stat main...FETCH_HEAD

          if git diff --quiet main...FETCH_HEAD; then
            echo "No upstream changes detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream changes detected."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          echo "upstream_commit=$UPSTREAM_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Create sync branch
        if: steps.compare.outputs.changed == 'true'
        run: |
          cd "$GITHUB_WORKSPACE"

          UPSTREAM_COMMIT="${{ steps.compare.outputs.upstream_commit }}"
          SHORT_SHA="${UPSTREAM_COMMIT:0:8}"
          BRANCH_NAME="sync/upstream-${SHORT_SHA}"

          echo "Creating sync branch:"
          echo "$BRANCH_NAME"

          git switch -c "$BRANCH_NAME"
          git merge --no-ff FETCH_HEAD \
            -m "Sync upstream code-modernization"

          echo "SYNC_BRANCH=$BRANCH_NAME" >> "$GITHUB_ENV"
